name: Deploy Cloudflare Pages

on:
  push:
    paths:
      - "posts/**"
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing CLOUDFLARE_DEPLOY_HOOK_URL repository secret."
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
